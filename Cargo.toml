[workspace]
members = [
    "crates/core",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/aitools1/mcp-guard"
authors = ["mcp-guard contributors"]

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# (de)serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# errors
thiserror = "2"
anyhow = "1"

# matching / secrets
regex = "1"

# cli + tui
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
